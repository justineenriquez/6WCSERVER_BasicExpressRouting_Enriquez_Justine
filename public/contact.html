<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | KapeBalen</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="nav">
    <a class="logo" href="/">KapeBalen</a>
    <nav>
      <a href="/">Home</a>
      <a href="/menu">Menu</a>
      <a href="/about">About</a>
      <a href="/contact">Contact</a>
    </nav>
  </header>
  <main>
    <section class="split">
      <img src="/images/contact-pic.jpg" alt="Hands holding a coffee cup">
      <div class="panel">
        <h1>Contact Us</h1>
        <form onsubmit="event.preventDefault(); this.reset(); alert('Thanks! We will get back to you soon.');">
          <label for="name">Name:</label>
          <input id="name" type="text" required>
          <label for="email">Email:</label>
          <input id="email" type="email" required>
          <label for="msg">Message:</label>
          <textarea id="msg" rows="6" required></textarea>
          <button type="submit">Send Message</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
